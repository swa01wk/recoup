[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recoup"
version = "0.1.0"
description = "AWS Autonomous Cloud Spend Recovery Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "boto3>=1.35.0",
    "strands-agents[openai]>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "anyio>=4.6.0",
    "structlog>=24.4.0",
    "aws-xray-sdk>=2.14.0",
    "slowapi>=0.1.9",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "moto[all]>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "boto3-stubs[bedrock,bedrock-runtime,dynamodb,s3,sqs,cloudwatch,logs,cloudtrail,ce,ec2,events,health,support]>=1.35.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recoup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (llm-as-judge, e2e)",
    "unit: fast deterministic tests",
    "integration: requires AWS credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A"]
ignore = ["ANN101", "ANN102", "ANN401", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
